# Declarative Automation Bundle definition for bq-portal-distribuidores
# Grupo Bimbo Brasil - DNA Analytics
bundle:
  name: bq-portal-distribuidores

include:
  - resources/*.yml

sync:
  exclude:
    - "__pycache__"
    - "src/app/.databricks"
    - "documents/**"
    - "*.pbix"
    - "*.docx"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-8674310331778219.19.azuredatabricks.net
      root_path: /Shared/CONSULTAS_AUTOMATIZADAS/${workspace.current_user.userName}/${bundle.name}/${bundle.target}/
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - group_name: DNA - GB Brasil Leaders
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: https://adb-8674310331778219.19.azuredatabricks.net
      root_path: /Shared/CONSULTAS_AUTOMATIZADAS/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - group_name: DNA - GB Brasil Leaders
        level: CAN_MANAGE
