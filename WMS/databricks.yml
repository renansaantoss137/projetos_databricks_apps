# This is a Declarative Automation Bundle definition for gestao_pedidos.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: gestao_pedidos
  uuid: 6c196dae-76c5-40fb-9a9b-1a11a558d066

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
    default: cat_dnabb_dv
  schema:
    description: The schema to use
    default: grobbappag_cz
  tech_lead:
    description: Pessoa responsavel por gerenciar e aprovar as alteracoes da aplicacao
    default: bruno.fellipe@grupobimbo.com

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-8674310331778219.19.azuredatabricks.net
      root_path: /Shared/CONSULTAS_AUTOMATIZADAS/${workspace.current_user.userName}/${bundle.name}/${bundle.target}/
    permissions:
      # O dev atual que está rodando o deploy:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - user_name: ana.ferraz@grupobimbo.com
        level: CAN_MANAGE
      - group_name: DNA - GB Brasil Leaders
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: https://adb-8674310331778219.19.azuredatabricks.net
      root_path: /Shared/CONSULTAS_AUTOMATIZADAS/${bundle.name}/${bundle.target}
    permissions:
      # O dev atual que está rodando o deploy:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - user_name: ana.ferraz@grupobimbo.com
        level: CAN_MANAGE
      - group_name: DNA - GB Brasil Leaders
        level: CAN_MANAGE
