# Declarative Automation Bundle definition for portal_compras
# Grupo Bimbo Brasil - DNA Analytics
bundle:
  name: portal_compras

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-8674310331778219.19.azuredatabricks.net
      root_path: /Shared/CONSULTAS_AUTOMATIZADAS/${workspace.current_user.userName}/${bundle.name}/${bundle.target}/
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - group_name: DNA - GB Brasil Leaders
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: https://adb-8674310331778219.19.azuredatabricks.net
      root_path: /Shared/CONSULTAS_AUTOMATIZADAS/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - group_name: DNA - GB Brasil Leaders
        level: CAN_MANAGE
    resources:
      jobs:
        compras_360_etl:
          name: "ETL Portal Compras - Lakebase Daily"
          schedule:
            pause_status: UNPAUSED
